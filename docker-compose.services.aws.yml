services:
  sensor_producer:
    build:
      context: ./services/sensor_producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    restart: unless-stopped
