services:

  sensor_producer:
    image: iot-industrial-sensor_producer:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SERVER_PORT: 0
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped

  alert_detector:
    image: iot-industrial-alert_detector:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SERVER_PORT: 0
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped

  alert_router:
    image: iot-industrial-alert_router:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      SERVER_PORT: 0
    depends_on:
      - kafka
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped

  plant_monitor_backend:
    image: iot-industrial-plant_monitor_backend:local
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SERVER_PORT: 8081
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped

  operator_console_backend:
    image: iot-industrial-operator_console_backend:local
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      SERVER_PORT: 8082
    depends_on:
      - kafka
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped

  action_dispatcher:
    image: iot-industrial-action_dispatcher:local
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      SERVER_PORT: 8083
    depends_on:
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped

  actuator_worker:
    image: iot-industrial-actuator_worker:local
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    depends_on:
      - rabbitmq
      - action_dispatcher
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped

  maintenance_worker:
    image: iot-industrial-maintenance_worker:local
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    depends_on:
      - rabbitmq
      - action_dispatcher
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped
