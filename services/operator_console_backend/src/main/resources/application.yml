spring:
  application:
    name: operator_console_backend
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:iot}
    password: ${RABBITMQ_PASSWORD:iot_dev_password}
server:
  port: ${SERVER_PORT:8082}
